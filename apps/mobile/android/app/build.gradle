import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"



// Release 签名凭据从仓库外的本机私密目录读取，密钥与密码永不进仓库。
// 目录优先级：环境变量 AURALFLOW_KEYSTORE_DIR > 本机默认 F:/auralflow-secrets。
// release 构建必须具备正式签名；缺失时显式失败，禁止产出 debug 签名的 release APK。
def keystoreDir = System.getenv("AURALFLOW_KEYSTORE_DIR") ?: "F:/auralflow-secrets"
def keystorePropertiesFile = file("${keystoreDir}/keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}
if (releaseRequested && !hasReleaseKeystore) {
    throw new GradleException(
        "Release 构建缺少正式签名配置。请设置 AURALFLOW_KEYSTORE_DIR 并提供 keystore.properties。"
    )
}

// Node 可执行文件由 NODE_BIN 覆盖，默认通过 PATH 解析，避免绑定特定操作系统路径。
def nodeExecutable = System.getenv("NODE_BIN") ?: "node"

// React Native 0.86 起 hermesc 迁出 react-native/sdks，改由独立的 hermes-compiler 包提供。
// pnpm 的 store 目录名带内容哈希，写死路径会在重装依赖后失效；从 react-native 包出发用 Node 解析。
// 解析失败直接抛错，不回退——静默跳过只会让构建产出无 Hermes 字节码的包。
def resolveHermescDir(String nodeBin) {
    def script = "const path=require('path');" +
        "const rn=path.dirname(require.resolve('react-native/package.json'));" +
        "const pkg=require.resolve('hermes-compiler/package.json',{paths:[rn]});" +
        "process.stdout.write(path.join(path.dirname(pkg),'hermesc').split(path.sep).join('/'));"
    def workDir = rootProject.projectDir.parentFile
    def execResult = providers.exec {
        it.workingDir = workDir
        it.commandLine(nodeBin, "-e", script)
    }
    if (execResult.result.get().exitValue != 0) {
        throw new GradleException(
            "无法解析 hermes-compiler 位置，请先执行 pnpm install。\n" +
            execResult.standardError.asText.get()
        )
    }
    def dir = execResult.standardOutput.asText.get().trim()
    if (!file(dir).isDirectory()) {
        throw new GradleException("解析到的 hermesc 目录不存在: ${dir}")
    }
    return dir
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // 插件会把 %OS-BIN% 替换为当前平台（Windows=win64-bin）。
    hermesCommand = "${resolveHermescDir(nodeExecutable)}/%OS-BIN%/hermesc"

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    nodeExecutableAndArgs = [nodeExecutable]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def mobilePackageFile = file("../../package.json")
if (!mobilePackageFile.exists()) {
    throw new GradleException("移动端 package.json 不存在: ${mobilePackageFile}")
}
def mobilePackage = new JsonSlurper().parse(mobilePackageFile)
def mobileVersionName = mobilePackage.version?.toString()?.trim()
def mobileVersionCodeValue = mobilePackage.androidVersionCode
if (!mobileVersionName) {
    throw new GradleException("apps/mobile/package.json 缺少有效 version")
}
if (!(mobileVersionCodeValue instanceof Number)
        || mobileVersionCodeValue.intValue() <= 0
        || mobileVersionCodeValue.doubleValue() != mobileVersionCodeValue.intValue()) {
    throw new GradleException("apps/mobile/package.json 缺少有效正整数 androidVersionCode")
}
def mobileVersionCode = mobileVersionCodeValue.intValue()

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = "cn.chenle.auralflow.mobile"
    defaultConfig {
        applicationId = "cn.chenle.auralflow.mobile"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = mobileVersionCode
        versionName = mobileVersionName
    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile = file(keystoreProperties['AURALFLOW_RELEASE_STORE_FILE'])
                storePassword = keystoreProperties['AURALFLOW_RELEASE_STORE_PASSWORD']
                keyAlias = keystoreProperties['AURALFLOW_RELEASE_KEY_ALIAS']
                keyPassword = keystoreProperties['AURALFLOW_RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = enableProguardInReleaseBuilds
            proguardFiles(getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro")
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // 本地音乐写回内嵌封面/歌词所需的 ID3/MP4 标签库（纯 Java，无需 NDK）。
    implementation("net.jthink:jaudiotagger:3.0.1")
}

// 按 ABI 拆分的 APK 全部复制到稳定外部路径（apk-alt），保留各架构文件名。
android.applicationVariants.configureEach { variant ->
    def variantName = variant.name
    def copyApkTask = tasks.register("copy${variantName.capitalize()}ApkToAlt", Copy) {
        dependsOn variant.packageApplicationProvider
        variant.outputs.each { output ->
            from output.outputFile
        }
        into layout.buildDirectory.dir("outputs/apk-alt")
    }

    variant.assembleProvider.configure {
        finalizedBy copyApkTask
    }
}
