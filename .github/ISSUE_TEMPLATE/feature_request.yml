name: 功能建议 / Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看一眼 [常见问题（FAQ）](https://github.com/0nini00/auralflow/blob/main/docs/FAQ.md) 与 [README](https://github.com/0nini00/auralflow/blob/main/README.zh-CN.md)：
        有些能力是**当前版本明确不提供**的（例如自定义源的沙箱隔离、可替换的内置网关），
        这类需求请在下面写清你希望它如何工作，而不是当作缺陷。

  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 一句话说清你想要什么。
      placeholder: 希望支持按专辑分组展示本地音乐。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题
      description: 你现在的使用场景是什么、卡在哪里？说清痛点比说清方案更有用。
      placeholder: |
        我的本地曲库有一千多首，现在只能按单曲列表看，
        想听某张专辑要手动画搜索，很费劲。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的实现方式
      description: 你设想的交互或行为。如果你不确定怎么写，描述"用起来应该是什么样"也可以。
      placeholder: |
        在本地音乐页加一个「专辑」标签页，
        点某个专辑进入详情页，列表里按音轨号排序。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - 桌面端（Windows）
        - 移动端（Android）
        - 两端都要
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在有没有别的办法凑合一下？为什么不够用？（可留空）
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、类似产品的实现、相关链接等（可留空）。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复建议。
          required: true
        - label: 我已读过 FAQ，确认这不是本文档已说明的既有行为或已知限制。
          required: true
